<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CATCHTABLE GLOBAL 샤오홍슈 콘텐츠 자동 생성기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f2efe9;
    color: #1a1a1a;
    min-height: 100vh;
  }

  header {
    background: #ffffff;
    padding: 20px 32px;
    border-bottom: 1px solid #e5dfd5;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  header h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: #1a1a1a;
  }

  .badge {
    background: #f2efe9;
    border: 1px solid #ddd8ce;
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 12px;
    color: #888070;
  }

  /* ─── 전체 래퍼 ─── */
  .app-wrapper {
    max-width: 1440px;
    margin: 0 auto;
    padding: 28px 24px 48px;
  }

  /* ─── 상단 행: 폼(좁게) + 진행상황(나란히) ─── */
  .top-row {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 16px;
    margin-bottom: 16px;
    align-items: start;
  }

  /* ─── 하단 행: 매장 선택(좌) + 갤러리(우) ─── */
  .bottom-row {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 16px;
    align-items: start;
  }

  @media (max-width: 960px) {
    .top-row    { grid-template-columns: 1fr; }
    .bottom-row { grid-template-columns: 1fr; }
  }

  /* ─── 입력 폼 ─── */
  .form-card {
    background: #ffffff;
    border: 1px solid #e5dfd5;
    border-radius: 14px;
    padding: 24px 20px;
  }

  .form-card h2 {
    font-size: 13px;
    font-weight: 600;
    color: #888070;
    margin-bottom: 16px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .field {
    margin-bottom: 12px;
  }
  .field label {
    display: block;
    font-size: 11px;
    color: #998f82;
    margin-bottom: 6px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }
  .field input, .field select {
    width: 100%;
    background: #faf8f4;
    border: 1px solid #ddd7cc;
    border-radius: 9px;
    padding: 10px 12px;
    color: #1a1a1a;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .field input:focus, .field select:focus {
    border-color: #b8b0a4;
    background: #fff;
  }
  .field input::placeholder { color: #bbb5ac; }
  .field select option { background: #fff; }

  .form-bottom-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 4px;
  }
  .form-bottom-row label {
    font-size: 12px;
    color: #998f82;
    white-space: nowrap;
  }
  .form-bottom-row select {
    background: #faf8f4;
    border: 1px solid #ddd7cc;
    border-radius: 8px;
    padding: 8px 10px;
    color: #1a1a1a;
    font-size: 13px;
    outline: none;
    flex: 1;
  }

  /* 검색 버튼 */
  .btn-search {
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 9px;
    padding: 10px 0;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    margin-top: 14px;
    transition: background 0.15s, transform 0.1s;
  }
  .btn-search:hover { background: #333; }
  .btn-search:active { transform: scale(0.98); }
  .btn-search:disabled {
    background: #ccc8c0;
    color: #fff;
    cursor: not-allowed;
  }

  /* ─── 진행 상황 ─── */
  .progress-area {
    background: #ffffff;
    border: 1px solid #e5dfd5;
    border-radius: 14px;
    padding: 20px 22px;
    display: none;
    min-height: 80px;
  }
  .progress-area.visible { display: block; }

  .progress-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .progress-header span { font-size: 13px; font-weight: 600; color: #444; }

  .spinner {
    width: 15px; height: 15px;
    border: 2px solid #ddd8ce;
    border-top-color: #555;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .log-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .log-list li {
    font-size: 12px;
    color: #999;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .log-list li.success { color: #2d8f50; }
  .log-list li.warn    { color: #c07820; }
  .log-list li.error   { color: #c03030; }
  .log-list li::before { content: '·'; font-size: 16px; flex-shrink: 0; }
  .log-list li.success::before { content: '✓'; font-size: 12px; }
  .log-list li.error::before   { content: '✗'; font-size: 12px; }

  /* ─── 결과 갤러리 ─── */
  .gallery-section { display: none; }
  .gallery-section.visible { display: block; }

  .gallery-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .gallery-header h2 { font-size: 15px; font-weight: 600; color: #1a1a1a; }
  .gallery-header small { font-size: 12px; color: #998f82; }

  .btn-download-all {
    background: #fff;
    border: 1px solid #ddd7cc;
    border-radius: 8px;
    padding: 7px 16px;
    font-size: 13px;
    color: #555;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .btn-download-all:hover { background: #f8f5f0; border-color: #c8c0b4; color: #1a1a1a; }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
  }

  .card-item {
    background: #fff;
    border: 1px solid #e5dfd5;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    position: relative;
  }
  .card-item:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  }
  .card-item.is-cover { border-color: #c8c0b4; }

  .card-item .thumb-wrap {
    aspect-ratio: 4/5;
    overflow: hidden;
    background: #f0ece5;
  }
  .card-item img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.2s;
  }
  .card-item:hover img { transform: scale(1.03); }

  .card-item .card-info { padding: 10px 12px; }
  .card-item .card-info .name {
    font-size: 13px;
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-item .card-info .actions { display: flex; gap: 6px; flex-wrap: wrap; }

  .btn-dl {
    background: #f2efe9;
    border: 1px solid #ddd7cc;
    border-radius: 5px;
    padding: 4px 9px;
    font-size: 11px;
    color: #666;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.15s;
  }
  .btn-dl:hover { background: #e8e3da; color: #1a1a1a; }

  /* ─── 사용 횟수 배지 ─── */
  .usage-badge {
    position: absolute;
    top: 8px; right: 8px;
    border-radius: 5px;
    padding: 3px 8px;
    font-size: 10px;
    font-weight: 700;
    z-index: 10;
    pointer-events: none;
  }
  .usage-badge.new   { background: rgba(34, 140, 80, 0.88);  color: #fff; }
  .usage-badge.used  { background: rgba(190, 90, 20, 0.88);  color: #fff; }
  .usage-badge.cover-label { background: rgba(60, 110, 200, 0.88); color: #fff; }

  /* ─── 편집 버튼 ─── */
  .btn-edit {
    position: absolute;
    top: 8px; left: 8px;
    background: rgba(255,255,255,0.82);
    border: 1px solid rgba(0,0,0,0.12);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 11px;
    color: #333;
    cursor: pointer;
    z-index: 10;
    transition: background 0.15s;
  }
  .btn-edit:hover { background: rgba(255,255,255,0.96); color: #000; }

  /* ─── 매장 선택 사이드바 ─── */
  .shop-sidebar {
    background: #fff;
    border: 1px solid #e5dfd5;
    border-radius: 14px;
    overflow: hidden;
    display: none;
    flex-direction: column;
    max-height: calc(100vh - 120px);
    position: sticky;
    top: 16px;
  }
  .shop-sidebar.visible { display: flex; }

  .sidebar-header {
    padding: 14px 16px;
    border-bottom: 1px solid #ede8e0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .sidebar-header h3 { font-size: 13px; font-weight: 600; color: #1a1a1a; }

  .shop-count-badge {
    background: #f2efe9;
    border: 1px solid #ddd7cc;
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 12px;
    color: #888070;
    font-weight: 600;
  }

  .sidebar-controls {
    padding: 8px 16px;
    display: flex;
    gap: 7px;
    border-bottom: 1px solid #ede8e0;
    flex-shrink: 0;
  }
  .btn-tiny {
    background: #f2efe9;
    border: 1px solid #ddd7cc;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    color: #666;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-tiny:hover { background: #e8e3da; color: #1a1a1a; }

  .shop-list {
    flex: 1;
    overflow-y: auto;
    padding: 2px 0;
  }

  .shop-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 16px;
    border-bottom: 1px solid #f0ece5;
    cursor: pointer;
    transition: background 0.15s;
  }
  .shop-item:hover { background: #faf8f4; }
  .shop-item:last-child { border-bottom: none; }

  .shop-item input[type="checkbox"] {
    width: 14px; height: 14px;
    flex-shrink: 0;
    margin-top: 3px;
    accent-color: #2d8f50;
    cursor: pointer;
  }

  .shop-item-info { flex: 1; min-width: 0; }
  .shop-item-name-en {
    font-size: 12px;
    font-weight: 600;
    color: #1a1a1a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .shop-item-name-ko {
    font-size: 11px;
    color: #998f82;
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .shop-item-meta {
    font-size: 11px;
    color: #bbb5ac;
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .shop-item-sessions {
    font-size: 10px;
    color: #ccc8c0;
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .shop-usage-badge {
    flex-shrink: 0;
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 10px;
    font-weight: 700;
    margin-top: 2px;
    white-space: nowrap;
  }
  .shop-usage-badge.new  { background: rgba(34,140,80,0.12);  color: #2d8f50; border: 1px solid rgba(34,140,80,0.25); }
  .shop-usage-badge.used { background: rgba(190,90,20,0.12);  color: #c07820; border: 1px solid rgba(190,90,20,0.25); }

  .sidebar-warning {
    padding: 10px 16px;
    background: rgba(192, 120, 32, 0.06);
    border-top: 1px solid rgba(192, 120, 32, 0.18);
    flex-shrink: 0;
  }
  .sidebar-warning .warn-text {
    font-size: 11px;
    color: #c07820;
    line-height: 1.5;
    margin-bottom: 7px;
  }
  .btn-proceed {
    background: rgba(192, 120, 32, 0.1);
    border: 1px solid rgba(192, 120, 32, 0.3);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    color: #c07820;
    cursor: pointer;
    transition: all 0.15s;
    width: 100%;
    font-weight: 600;
  }
  .btn-proceed:hover { background: rgba(192, 120, 32, 0.18); }

  .sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid #ede8e0;
    flex-shrink: 0;
  }

  .btn-generate {
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 11px 20px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    transition: background 0.15s, transform 0.1s;
  }
  .btn-generate:hover { background: #333; }
  .btn-generate:active { transform: scale(0.98); }
  .btn-generate:disabled {
    background: #ddd8ce;
    color: #fff;
    cursor: not-allowed;
  }

  /* ─── 이미지 교체 모달 ─── */
  .swap-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 2000;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .swap-overlay.open { display: flex; }

  .swap-panel {
    background: #fff;
    border: 1px solid #e5dfd5;
    border-radius: 16px;
    width: 100%;
    max-width: 640px;
    max-height: 90vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 40px rgba(0,0,0,0.14);
  }
  .swap-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid #ede8e0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .swap-header h3 { font-size: 14px; font-weight: 600; color: #1a1a1a; }
  .swap-close { font-size: 22px; cursor: pointer; color: #bbb; line-height: 1; }
  .swap-close:hover { color: #333; }

  .swap-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }

  .slot-tabs { display: flex; gap: 7px; }
  .slot-tab {
    background: #f2efe9;
    border: 1px solid #ddd7cc;
    border-radius: 7px;
    padding: 6px 14px;
    font-size: 12px;
    color: #888;
    cursor: pointer;
    transition: all 0.15s;
  }
  .slot-tab.active { background: #1a1a1a; border-color: #1a1a1a; color: #fff; }

  .slot-preview {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #faf8f4;
    border-radius: 10px;
    padding: 10px 12px;
  }
  .slot-preview img {
    width: 68px; height: 68px;
    object-fit: cover;
    border-radius: 6px;
    flex-shrink: 0;
    background: #ede8e0;
  }
  .slot-preview span { font-size: 12px; color: #888; }

  .pick-label { font-size: 11px; color: #bbb; text-transform: uppercase; letter-spacing: 0.3px; }
  .pick-empty { font-size: 13px; color: #bbb; padding: 10px 0; }

  .img-picker {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 7px;
  }
  .pick-img {
    width: 100%; aspect-ratio: 1;
    object-fit: cover;
    border-radius: 6px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.15s, transform 0.1s;
    background: #ede8e0;
  }
  .pick-img:hover { transform: scale(1.04); border-color: #c8c0b4; }
  .pick-img.selected { border-color: #3a7edd; }
  .pick-img.error-img { opacity: 0.3; cursor: default; }

  .swap-footer {
    padding: 12px 20px 16px;
    border-top: 1px solid #ede8e0;
    display: flex;
    justify-content: flex-end;
    flex-shrink: 0;
  }
  .btn-regen {
    background: #1a1a1a; color: #fff;
    border: none; border-radius: 8px;
    padding: 9px 24px; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: background 0.15s;
  }
  .btn-regen:hover { background: #333; }
  .btn-regen:disabled { background: #ccc8c0; color: #fff; cursor: not-allowed; }

  /* ─── 라이트박스 ─── */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.82);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-height: 90vh;
    max-width: 90vw;
    border-radius: 8px;
    object-fit: contain;
  }
  .lightbox-close {
    position: absolute;
    top: 18px; right: 22px;
    font-size: 28px;
    cursor: pointer;
    color: #aaa;
    line-height: 1;
  }
  .lightbox-close:hover { color: #fff; }

  /* ─── SNS 텍스트 ─── */
  .sns-section  { background: #fff; border-top: 1px solid #e5dfd5; margin-top: 40px; }
  .sns-inner    { max-width: 1440px; margin: 0 auto; padding: 28px 24px; }
  .sns-header   { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .sns-title    { font-size: 14px; font-weight: 700; color: #1a1a1a; margin: 0; }
  .btn-copy     {
    padding: 6px 16px; border-radius: 6px; border: 1px solid #ddd7cc;
    background: #fff; color: #333; font-size: 12px; cursor: pointer;
    transition: background 0.15s;
  }
  .btn-copy:hover { background: #f2efe9; }
  .btn-copy.copied { background: #2d8f50; border-color: #2d8f50; color: #fff; }
  .sns-textarea {
    width: 100%; min-height: 220px; padding: 14px 16px;
    border: 1px solid #ddd7cc; border-radius: 8px;
    font-size: 14px; line-height: 1.8; color: #333;
    background: #faf8f4; resize: vertical; box-sizing: border-box;
    font-family: inherit;
  }

  /* ─── 제작 이력 ─── */
  .history-section { background: #faf8f4; border-top: 1px solid #e5dfd5; }
  .history-inner   { max-width: 1440px; margin: 0 auto; padding: 28px 24px 48px; }
  .history-title   { font-size: 14px; font-weight: 700; color: #1a1a1a; margin: 0 0 14px; }
  .session-list    { display: flex; flex-wrap: wrap; gap: 7px; }
  .session-chip    {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 13px; border-radius: 20px;
    background: #fff; border: 1px solid #ddd7cc;
    font-size: 12px; color: #444;
  }
  .chip-date  { font-size: 10px; color: #bbb5ac; }
  .chip-count { font-size: 10px; color: #ccc8c0; }

  @media (max-width: 640px) {
    .app-wrapper { padding: 20px 16px 40px; }
    header { padding: 16px; }
  }
</style>
</head>
<body>

<header>
  <h1>CATCHTABLE GLOBAL</h1>
  <span class="badge">샤오홍슈 콘텐츠 자동 생성기</span>
</header>

<div class="app-wrapper">

  <!-- 상단 행: 폼 + 진행상황 -->
  <div class="top-row">

    <!-- 입력 폼 (좁게) -->
    <div class="form-card">
      <h2>지역 · 음식 종류</h2>
      <div class="field">
        <label>지역</label>
        <input id="regionInput" type="text" placeholder="예: 강남, 홍대, 성수" list="regionList" autocomplete="off">
        <datalist id="regionList"></datalist>
      </div>
      <div class="field">
        <label>음식 종류</label>
        <input id="foodInput" type="text" placeholder="예: 한우오마카세, Grilled Beef" list="foodList" autocomplete="off">
        <datalist id="foodList"></datalist>
      </div>
      <div class="form-bottom-row">
        <label>매장 수</label>
        <select id="limitSelect">
          <option value="5">5개</option>
          <option value="10" selected>10개</option>
          <option value="15">15개</option>
          <option value="20">20개</option>
        </select>
      </div>
      <button class="btn-search" id="btnSearch" onclick="doSearch()">매장 검색</button>
    </div>

    <!-- 진행 상황 -->
    <div class="progress-area" id="progressArea">
      <div class="progress-header">
        <div class="spinner" id="spinner"></div>
        <span id="progressTitle">처리 중...</span>
      </div>
      <ul class="log-list" id="logList"></ul>
    </div>

  </div>

  <!-- 하단 행: 매장 선택(좌) + 갤러리(우) -->
  <div class="bottom-row">

    <!-- 매장 선택 사이드바 -->
    <div class="shop-sidebar" id="shopSidebar">
      <div class="sidebar-header">

</div>

      <button class="btn-copy" id="btnCopy" onclick="copySnsText()">복사</button>
    </div>
    <textarea class="sns-textarea" id="snsTextarea" readonly></textarea>
  </div>
</section>

<!-- 제작 이력 섹션 -->
<section class="history-section">
  <div class="history-inner">
    <h2 class="history-title">제작 이력</h2>
    <div id="sessionList" class="session-list"></div>
  </div>
</section>

<script>
let eventSource = null;
let currentFolder = '';
let allShops = [];
let searchLimit = 10;

// 옵션 로드
async function loadOptions() {
  try {
    const res = await fetch('/api/options');
    const data = await res.json();

    const regionList = document.getElementById('regionList');
    data.regions.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r;
      regionList.appendChild(opt);
    });

    const foodList = document.getElementById('foodList');
    data.foods.forEach(f => {
      const opt = document.createElement('option');
      opt.value = f;
      foodList.appendChild(opt);
    });
  } catch(e) {
    console.error('옵션 로드 실패:', e);
  }
}

// ─── 검색 ───────────────────────────────────────────────────

async function doSearch() {
  const region = document.getElementById('regionInput').value.trim();
  const food   = document.getElementById('foodInput').value.trim();
  const limit  = parseInt(document.getElementById('limitSelect').value);

  if (!region || !food) {
    alert('지역과 음식 종류를 입력해주세요.');
    return;
  }

  searchLimit = limit;

  const btn = document.getElementById('btnSearch');
  btn.disabled = true;
  btn.textContent = '검색 중...';
  document.getElementById('btnGenerate').disabled = true;

  try {
    const params = new URLSearchParams({ region, food, limit });
    const res  = await fetch(`/api/search?${params}`);
    const text = await res.text();
    let data;
    try {
      data = JSON.parse(text);
    } catch(parseErr) {
      console.error('서버 응답:', text.slice(0, 500));
      alert('서버 오류가 발생했습니다. 콘솔을 확인해주세요.');
      return;
    }

    if (data.error) {
      alert('검색 오류: ' + data.error);
      return;
    }

    allShops = data.shops || [];
    renderShopList(allShops, limit);

    document.getElementById('shopSidebar').classList.add('visible');

  } catch(e) {
    alert('검색 실패: ' + e);
  } finally {
    btn.disabled = false;
    btn.textContent = '매장 검색';
  }
}

function renderShopList(shops, limit) {
  const list = document.getElementById('shopList');
  list.innerHTML = '';

  if (shops.length === 0) {
    list.innerHTML = '<div style="padding:20px 16px;font-size:12px;color:#bbb;">검색 결과 없음</div>';
    updateCountBadge();
    document.getElementById('sidebarWarning').style.display = 'none';
    return;
  }

  shops.forEach((shop, idx) => {
    const isChecked = idx < limit;
    const usedCount = shop.used_count || 0;
    const nameEn    = shop.name_en || shop.name || shop.slug;
    const nameKo    = (shop.name_en && shop.name && shop.name !== shop.name_en) ? shop.name : '';
    const meta      = [shop.food_kind_en || shop.food_kind, shop.land_name_en || shop.land_name]
                        .filter(Boolean).join(' · ');
    const sessions  = (shop.sessions || []).slice(-2).join(', ');

    const item = document.createElement('div');
    item.className = 'shop-item';
    item.innerHTML = `
      <input type="checkbox" class="shop-checkbox" data-slug="${shop.slug}" ${isChecked ? 'checked' : ''} onchange="onCheckboxChange()">
      <div class="shop-item-info">
        <div class="shop-item-name-en">${escHtml(nameEn)}</div>
        ${nameKo ? `<div class="shop-item-name-ko">${escHtml(nameKo)}</div>` : ''}
        ${meta ? `<div class="shop-item-meta">${escHtml(meta)}</div>` : ''}
        ${sessions ? `<div class="shop-item-sessions">이전: ${escHtml(sessions)}</div>` : ''}
      </div>
      <span class="shop-usage-badge ${usedCount === 0 ? 'new' : 'used'}">${usedCount === 0 ? 'NEW' : usedCount + '회'}</span>
    `;
    item.querySelector('.shop-item-info').onclick = () => {
      const cb = item.querySelector('input[type="checkbox"]');
      cb.checked = !cb.checked;
      onCheckboxChange();
    };
    list.appendChild(item);
  });

  if (shops.length < limit) {
    const warnDiv  = document.getElementById('sidebarWarning');
    const warnText = document.getElementById('sidebarWarnText');
    const region   = document.getElementById('regionInput').value.trim();
    const food     = document.getElementById('foodInput').value.trim();
    warnText.textContent = `"${region} · ${food}" 검색 결과: ${shops.length}개\n요청하신 ${limit}개보다 적습니다.`;
    warnDiv.style.display = 'block';
  } else {
    document.getElementById('sidebarWarning').style.display = 'none';
    document.getElementById('btnGenerate').disabled = false;
  }

  updateCountBadge();
}

function onCheckboxChange() {
  updateCountBadge();
  const checked = getSelectedSlugs().length;
  if (checked > 0) {
    const total = allShops.length;
    if (total >= searchLimit) {
      document.getElementById('sidebarWarning').style.display = 'none';
    }
    document.getElementById('btnGenerate').disabled = false;
  } else {
    document.getElementById('btnGenerate').disabled = true;
  }
}

function proceedWithFewer() {
  document.getElementById('sidebarWarning').style.display = 'none';
  const checked = getSelectedSlugs().length;
  if (checked > 0) {
    document.getElementById('btnGenerate').disabled = false;
  }
}

function selectAllShops() {
  document.querySelectorAll('.shop-checkbox').forEach(cb => cb.checked = true);
  onCheckboxChange();
}

function deselectAllShops() {
  document.querySelectorAll('.shop-checkbox').forEach(cb => cb.checked = false);
  onCheckboxChange();
}

function getSelectedSlugs() {
  return Array.from(document.querySelectorAll('.shop-checkbox:checked'))
              .map(cb => cb.dataset.slug);
}

function updateCountBadge() {
  const checked = getSelectedSlugs().length;
  const total   = allShops.length;
  document.getElementById('shopCountBadge').textContent = `${checked} / ${total}`;
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── 로그 ────────────────────────────────────────────────────

function addLog(msg, type = 'log') {
  const li = document.createElement('li');
  li.textContent = msg;
  if (type !== 'log') li.className = type;
  document.getElementById('logList').appendChild(li);
  li.scrollIntoView({ behavior: 'smooth' });
}

// ─── 생성 ────────────────────────────────────────────────────

function startGenerate() {
  const region   = document.getElementById('regionInput').value.trim();
  const food     = document.getElementById('foodInput').value.trim();
  const selected = getSelectedSlugs();

  if (!region || !food) {
    alert('지역과 음식 종류를 입력해주세요.');
    return;
  }
  if (selected.length === 0) {
    alert('생성할 매장을 선택해주세요.');
    return;
  }

  document.getElementById('btnGenerate').disabled = true;
  document.getElementById('btnSearch').disabled   = true;
  document.getElementById('logList').innerHTML = '';
  document.getElementById('gallerySection').classList.remove('visible');
  document.getElementById('progressArea').classList.add('visible');
  document.getElementById('spinner').style.display = 'block';
  document.getElementById('progressTitle').textContent = '생성 중...';
  currentFolder = '';

  if (eventSource) eventSource.close();

  const slugs  = selected.join(',');
  const params = new URLSearchParams({ region, food, limit: selected.length, slugs });
  eventSource  = new EventSource(`/api/generate?${params}`);

  eventSource.onmessage = function(e) {
    const data = JSON.parse(e.data);

    if (data.type === 'log') {
      addLog(data.message);
    } else if (data.type === 'success') {
      addLog(data.message, 'success');
    } else if (data.type === 'warn') {
      addLog(data.message, 'warn');
    } else if (data.type === 'error') {
      addLog(data.message, 'error');
      finishGenerate(false);
    } else if (data.type === 'done') {
      currentFolder = data.folder || '';
      addLog(`${data.images.length}개 카드 생성 완료!`, 'success');
      finishGenerate(true);
      showGallery(data.images, region, food, data.cover, data.thumbnail);
      showSnsText(data.images, region, food);
    }
  };

  eventSource.onerror = function() {
    addLog('서버 연결 오류', 'error');
    finishGenerate(false);
  };
}

function finishGenerate(success) {
  document.getElementById('btnGenerate').disabled = false;
  document.getElementById('btnSearch').disabled   = false;
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('progressTitle').textContent = success ? '완료' : '오류 발생';
  if (eventSource) { eventSource.close(); eventSource = null; }
}

async function downloadAll(e) {
  e.preventDefault();
  if (!currentFolder) { alert('먼저 콘텐츠를 생성해주세요.'); return; }
  const btn = document.getElementById('btnDownloadAll');
  btn.textContent = '저장 중...';
  btn.style.pointerEvents = 'none';
  try {
    const res  = await fetch('/api/download', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({folder: currentFolder}),
    });
    const data = await res.json();
    if (data.ok) {
      btn.textContent = `✓ 저장 완료 (${data.count}개)`;
      btn.style.background = '#2d8f50';
      btn.style.borderColor = '#2d8f50';
      btn.style.color = '#fff';
      loadSessions();
    } else {
      btn.textContent = '오류: ' + (data.error || '알 수 없음');
      btn.style.background = '#c03030';
      btn.style.pointerEvents = '';
    }
  } catch(err) {
    btn.textContent = '저장 실패';
    btn.style.background = '#c03030';
    btn.style.pointerEvents = '';
  }
}

// ─── SNS 텍스트 생성 ─────────────────────────────────────────

// 음식 종류 → 중국어 (간체)
const _FOOD_MAP = {
  '한식': '韩国料理', '일식': '日本料理', '중식': '中国料理',
  '오마카세': '割烹', '한우': '韩牛', '이자카야': '居酒屋',
  '카페': '咖啡厅', '베이커리': '面包店', '디저트': '甜点',
  '브런치': '早午餐', '와인': '葡萄酒', '맥주': '啤酒',
  '칵테일': '鸡尾酒', '바': '酒吧', '해산물': '海鲜',
  '파스타': '意面', '피자': '披萨', '버거': '汉堡',
  '구이': '烤肉', '바베큐': '烧烤', '퓨전': '创意料理',
  '비건': '素食', '초밥': '寿司', '사시미': '刺身',
  '라멘': '拉面', '야키토리': '烧鸟', '스테이크': '牛排',
  '뷔페': '自助餐', '코스': '套餐料理',
  'Korean': '韩国料理', 'Japanese': '日本料理', 'Chinese': '中国料理',
  'Italian': '意大利料理', 'French': '法国料理', 'Spanish': '西班牙料理',
  'American': '美式料理', 'Thai': '泰国料理', 'Vietnamese': '越南料理',
  'Indian': '印度料理', 'Mexican': '墨西哥料理',
  'Omakase': '割烹', 'Fine Dining': '高端料理', 'Kaiseki': '怀石料理',
  'Buffet': '自助餐', 'Course': '套餐料理',
  'Korean BBQ': '韩式烤肉', 'Grilled Beef': '烤牛肉', 'Hanwoo': '韩牛',
  'Grilled Pork': '烤猪肉', 'Steak': '牛排',
  'Sushi': '寿司', 'Sashimi': '刺身', 'Ramen': '拉面',
  'Izakaya': '居酒屋', 'Yakitori': '烧鸟',
  'Cafe': '咖啡厅', 'Bakery': '面包店', 'Dessert': '甜点', 'Brunch': '早午餐',
  'Wine': '葡萄酒', 'Beer': '啤酒', 'Cocktail': '鸡尾酒', 'Bar': '酒吧',
  'Seafood': '海鲜', 'Pasta': '意面', 'Pizza': '披萨', 'Burger': '汉堡',
  'BBQ': '烧烤', 'Fusion': '创意料理', 'Vegan': '素食',
  'Shabu-Shabu': '涮涮锅', 'Chicken': '鸡肉料理', 'Noodles': '面条',
};

function foodToZh(food) {
  for (const [key, zh] of Object.entries(_FOOD_MAP)) {
    if (food.includes(key)) return zh;
  }
  return food;
}

// 서울 외 도시 → 중국어
const _CITY_MAP = {
  '제주': '济州', '부산': '釜山', '인천': '仁川', '대구': '大邱',
  '대전': '大田', '광주': '光州', '울산': '蔚山', '수원': '水原',
  '경주': '庆州', '전주': '全州', '강릉': '江陵', '춘천': '春川',
};
// 서울 구/동 → 중국어
const _DISTRICT_MAP = {
  '강남': '江南', '홍대': '弘大', '성수': '城水', '이태원': '梨泰院',
  '명동': '明洞', '종로': '钟路', '마포': '麻浦', '용산': '龙山',
  '서초': '瑞草', '송파': '松坡', '강동': '江东', '강서': '江西',
  '은평': '恩平', '노원': '芦原', '동대문': '东大门', '중구': '中区',
  '신촌': '新村', '합정': '合井', '연남': '延南', '망원': '望远',
  '압구정': '狎鸥亭', '청담': '清潭', '삼성': '三成', '역삼': '驿三',
  '신사': '新沙', '논현': '论峴', '방배': '方背', '잠실': '蚕室',
  '건대': '建大', '왕십리': '往十里', '뚝섬': '纛岛', '강변': '江边',
};

function regionToZh(region) {
  for (const [ko, zh] of Object.entries(_CITY_MAP)) {
    if (region.includes(ko)) return { city: zh, district: null };
  }
  for (const [ko, zh] of Object.entries(_DISTRICT_MAP)) {
    if (region.includes(ko)) return { city: '首尔', district: zh };
  }
  return { city: '首尔', district: null };
}

// 주소 줄바꿈: 区/구 기준, 22자 초과 시
function breakAddress(addr) {
  if (!addr || addr.length <= 22) return addr;
  // 중국어: 区 뒤에서 줄바꿈
  const zhIdx = addr.indexOf('区');
  if (zhIdx > 0 && zhIdx < addr.length - 2) {
    return addr.slice(0, zhIdx + 1) + '\n    ' + addr.slice(zhIdx + 1).trim();
  }
  // 한국어: '구 ' 뒤에서 줄바꿈
  const koMatch = addr.match(/구\s+/);
  if (koMatch && koMatch.index > 0) {
    const cut = koMatch.index + koMatch[0].length;
    return addr.slice(0, cut).trim() + '\n    ' + addr.slice(cut).trim();
  }
  return addr;
}

function buildSnsText(images, region, food) {
  const { city, district } = regionToZh(region);
  const foodZh = images.find(i => i.food_kind_zh)?.food_kind_zh || foodToZh(food);
  const count  = images.length;

  const locationParts = [city, district].filter(Boolean).join(' ');
  const title = `CATCHTABLE 精选：${locationParts} ${foodZh} 餐厅 TOP ${count}!`;

  const shopLines = images.map(img => {
    const name = img.name_zh || img.name;
    const addr = breakAddress(img.address || '');
    return `${name} 📍${addr}`;
  }).join('\n');

  const cityTag = city !== '首尔'
    ? `#${city}#${city}旅行\u200c\u200c#${city}旅游\u200c\u200c`
    : `#首尔#首尔旅行\u200c\u200c#首尔旅游\u200c\u200c`;
  const tags = `#韩国旅游\u200c\u200c#韩国\u200c\u200c\u200c\u200c\u200c\u200c${cityTag}#韩国美食\u200c\u200c#韩国探店\u200c\u200c#韩国地道美食\u200c\u200c`;

  return `${title}\n\n--\n\n${shopLines}\n\n${tags}`;
}

function showSnsText(images, region, food) {
  const text = buildSnsText(images, region, food);
  document.getElementById('snsTextarea').value = text;
  document.getElementById('snsSection').style.display = '';
  const btn = document.getElementById('btnCopy');
  btn.textContent = '복사';
  btn.classList.remove('copied');
}

function copySnsText() {
  const ta  = document.getElementById('snsTextarea');
  const btn = document.getElementById('btnCopy');
  navigator.clipboard.writeText(ta.value).then(() => {
    btn.textContent = '✓ 복사됨';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '복사'; btn.classList.remove('copied'); }, 2000);
  }).catch(() => {
    ta.select();
    document.execCommand('copy');
    btn.textContent = '✓ 복사됨';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '복사'; btn.classList.remove('copied'); }, 2000);
  });
}

async function loadSessions() {
  try {
    const res  = await fetch('/api/sessions');
    const list = await res.json();
    const el   = document.getElementById('sessionList');
    if (!el) return;
    if (!list.length) {
      el.innerHTML = '<span style="color:#bbb;font-size:12px">아직 다운로드 이력이 없습니다.</span>';
      return;
    }
    el.innerHTML = list.map(s => `
      <div class="session-chip">
        <span class="chip-date">${s.date}</span>${s.region} · ${s.food}
        <span class="chip-count">${s.count}개</span>
      </div>
    `).join('');
  } catch(e) {}
}

// ─── 갤러리 ─────────────────────────────────────────────────

function showGallery(images, region, food, coverPath, thumbnailPath) {
  const section = document.getElementById('gallerySection');
  const grid    = document.getElementById('galleryGrid');
  grid.innerHTML = '';

  document.getElementById('galleryTitle').textContent = `${region} · ${food}`;
  document.getElementById('galleryMeta').textContent  = `${images.length}개 매장`;

  if (thumbnailPath) {
    const thumbItem = document.createElement('div');
    thumbItem.className = 'card-item is-cover';
    thumbItem.innerHTML = `
      <div class="thumb-wrap" onclick="openLightbox('/output/${thumbnailPath}')">
        <img src="/output/${thumbnailPath}" alt="컬렉션 썸네일" loading="lazy">
      </div>
      <span class="usage-badge cover-label">THUMB</span>
      <div class="card-info">
        <div class="name">컬렉션 썸네일</div>
        <div class="actions">
          <a class="btn-dl" href="/output/${thumbnailPath}" download>썸네일 ↓</a>
        </div>
      </div>
    `;
    grid.appendChild(thumbItem);
  }

  images.forEach(img => {
    const usedCount  = img.used_count || 0;
    const badgeClass = usedCount === 0 ? 'new' : 'used';
    const badgeText  = usedCount === 0 ? 'NEW' : `${usedCount}회 사용`;

    const imgData = JSON.stringify(img).replace(/"/g, '&quot;');

    const item = document.createElement('div');
    item.className = 'card-item';
    item.innerHTML = `
      <div class="thumb-wrap" onclick="openLightbox('/output/${img.card}')">
        <img src="/output/${img.card}" alt="${img.name}" loading="lazy">
      </div>
      <span class="usage-badge ${badgeClass}">${badgeText}</span>
      <button class="btn-edit" onclick="openSwap(event, this.closest('.card-item'), ${imgData})">편집</button>
      <div class="card-info">
        <div class="name">${img.name}</div>
        <div class="actions">
          <a class="btn-dl" href="/output/${img.card}" download>카드 ↓</a>
        </div>
      </div>
    `;
    grid.appendChild(item);
  });

  section.classList.add('visible');
  section.scrollIntoView({ behavior: 'smooth' });
}

// ─── 이미지 교체 ─────────────────────────────────────────────
const swap = {
  cardEl: null,
  data: null,
  slots: { main: null, sub1: null, sub2: null },
  activeSlot: 'main',
};

function openSwap(e, cardEl, data) {
  e.stopPropagation();
  swap.cardEl    = cardEl;
  swap.data      = data;
  swap.slots     = {
    main: data.current_images[0] || null,
    sub1: data.current_images[1] || data.current_images[0] || null,
    sub2: data.current_images[2] || data.current_images[0] || null,
  };
  swap.activeSlot = 'main';

  document.getElementById('swapTitle').textContent = data.name;
  document.querySelectorAll('.slot-tab').forEach((b, i) => {
    b.classList.toggle('active', i === 0);
  });

  renderPicker();
  updatePreview();
  document.getElementById('swapOverlay').classList.add('open');
}

function closeSwap() {
  document.getElementById('swapOverlay').classList.remove('open');
}

function closeSwapOverlay(e) {
  if (e.target === document.getElementById('swapOverlay')) closeSwap();
}

function selectSlot(slot, btn) {
  swap.activeSlot = slot;
  document.querySelectorAll('.slot-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updatePreview();
  highlightPicker();
}

function updatePreview() {
  const url = swap.slots[swap.activeSlot];
  const previewImg = document.getElementById('slotPreviewImg');
  previewImg.src = url ? url + '?t=' + Date.now() : '';
  previewImg.onerror = () => { previewImg.style.opacity = '0.3'; };
  previewImg.onload  = () => { previewImg.style.opacity = '1'; };
  const labels = { main: '현재 메인 이미지', sub1: '현재 서브 1 이미지', sub2: '현재 서브 2 이미지' };
  document.getElementById('slotPreviewLabel').textContent = labels[swap.activeSlot];
}

function highlightPicker() {
  const current = swap.slots[swap.activeSlot];
  document.querySelectorAll('.pick-img').forEach(img => {
    img.classList.toggle('selected', img.dataset.url === current);
  });
}

function renderPicker() {
  const picker = document.getElementById('imgPicker');
  picker.innerHTML = '';

  const imgs = swap.data.local_images || [];
  if (imgs.length === 0) {
    const msg = document.createElement('div');
    msg.className = 'pick-empty';
    msg.textContent = '사용 가능한 이미지가 없습니다.';
    picker.appendChild(msg);
    return;
  }

  imgs.forEach(url => {
    const img = document.createElement('img');
    img.className  = 'pick-img';
    img.src        = url;
    img.dataset.url = url;
    img.loading    = 'lazy';
    img.onerror    = () => { img.classList.add('error-img'); };
    img.onclick    = () => {
      if (img.classList.contains('error-img')) return;
      swap.slots[swap.activeSlot] = url;
      updatePreview();
      highlightPicker();
    };
    picker.appendChild(img);
  });
  highlightPicker();
}

async function doRegenerate() {
  const btn = document.getElementById('btnRegen');
  btn.disabled    = true;
  btn.textContent = '생성 중...';

  try {
    const res = await fetch('/api/regenerate', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        slug:    swap.data.slug,
        card:    swap.data.card,
        name:    swap.data.name,
        address: swap.data.address,
        main:    swap.slots.main,
        sub1:    swap.slots.sub1,
        sub2:    swap.slots.sub2,
      }),
    });
    const result = await res.json();
    if (result.ok) {
      const ts = result.ts;
      const thumbEl = swap.cardEl.querySelector('.thumb-wrap img');
      thumbEl.src = `/output/${swap.data.card}?t=${ts}`;
      swap.cardEl.querySelector('.thumb-wrap').onclick =
        () => openLightbox(`/output/${swap.data.card}?t=${ts}`);
      swap.data.current_images = [swap.slots.main, swap.slots.sub1, swap.slots.sub2];
      closeSwap();
    }
  } catch(e) {
    alert('재생성 실패: ' + e);
  } finally {
    btn.disabled    = false;
    btn.textContent = '재생성';
  }
}

function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox(e) {
  if (!e || e.target !== document.getElementById('lightboxImg')) {
    document.getElementById('lightbox').classList.remove('open');
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeLightbox(); closeSwap(); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (
    document.activeElement === document.getElementById('regionInput') ||
    document.activeElement === document.getElementById('foodInput')
  )) {
    doSearch();
  }
});

loadOptions();
loadSessions();
</script>
